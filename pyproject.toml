[project]
name = "mysql-question-evaluator"
version = "0.1.0"
description = "Local MySQL question benchmark generator powered by Claude Code CLI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.1",
    "python-multipart>=0.0.12",
    "sqlglot>=25.30.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
